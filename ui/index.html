<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sibyl · Dokumentation</title>
<style>:root{color-scheme:light dark;font:15px/1.6 system-ui,sans-serif}body{max-width:1100px;margin:20px auto;padding:18px}header{display:flex;justify-content:space-between;align-items:center}a{color:inherit}input,textarea,button{font:inherit;padding:9px;border:1px solid #888}input,textarea{width:100%;box-sizing:border-box}textarea{min-height:220px}button{cursor:pointer}label{display:block;margin:12px 0}.columns{display:grid;grid-template-columns:1fr 1fr;gap:20px}#preview{border:1px solid #888;padding:15px;white-space:pre-wrap;overflow-wrap:anywhere}.sub{opacity:.7}@media(max-width:640px){.columns{grid-template-columns:1fr}}</style></head><body>
<header><h1>Dokumentation</h1><a href="/">← Sibyl System</a></header>
<p class="sub">Eigenständige Wiki-Moduloberfläche: Markdown-Vorschau. Dies ist eine <strong>nicht persistente Vorschau</strong>; reale Speicherung, Versionshistorie und Medien werden mit dem isolierten Backend-Worker ergänzt. Die ursprüngliche Wiki-Oberfläche wird schrittweise portiert.</p>
<label>Dokumenttitel <input id="title" maxlength="240" value="Neue Dokumentation"></label>
<div class="columns"><label>Markdown-Inhalt<textarea id="body"># Willkommen
Hier entsteht die modulare Sibyl-Dokumentation.</textarea></label>
<section><h2 id="preview-title">Vorschau</h2><div id="preview"></div></section></div>
<button id="update">Vorschau aktualisieren</button><p id="status" role="status"></p>
<script>
"use strict";
function update(){document.getElementById("preview-title").textContent=document.getElementById("title").value.trim()||"Ohne Titel";
 document.getElementById("preview").textContent=document.getElementById("body").value;
 document.getElementById("status").textContent="Vorschau aktualisiert – Änderungen werden in dieser Version noch nicht gespeichert.";}
document.getElementById("update").onclick=update;update();
</script></body></html>
