<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sibyl · Dokumentation</title><link rel="stylesheet" href="wiki.css"><script defer src="bridge.js"></script><script defer src="wiki.js"></script></head><body>
